<!DOCTYPE html>
<html>
<head>
  <title>Koko VR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.164.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
  <script src="js/globals.js"></script>
  <script src="js/components/horse-mover.js"></script>
  <script src="js/components/horse-manager.js"></script>
  <script src="js/components/lane-controller.js"></script>
  <script src="js/components/intro-director.js"></script>
  <script src="js/components/finale-director.js"></script>

  <script src="js/components/shell-mover.js"></script>
  <script src="js/components/shell-manager.js"></script>
  <script src="js/components/player-collision.js"></script>
  <script src="js/components/game-reset.js"></script>
  <script src="js/menu-listener.js"></script>
  <script src="js/components/ground-loop.js"></script>
</head>
<body>
  <a-scene renderer="antialias: false; precision: low; powerPreference: high-performance" fog="type: linear; color: #87CEEB; near: 0; far: 200" menu-listener game-reset>
    <a-assets>
      <img id="sky" src="assets/map/fire_sky.jpg">
      <a-asset-item id="wall" src="assets/map/wall.glb"></a-asset-item>
      <a-asset-item id="titan_run" src="assets/titan/run.glb"></a-asset-item>
      <a-asset-item id="cannon" src="assets/map/cannon/cannon.glb"></a-asset-item>
      <a-asset-item id="ground" src="assets/map/ground.glb"></a-asset-item>
  <img id="banner" src="assets/map/banner.png">
      <img id="wall_image" src="assets/map/wall_image.png">
  <a-asset-item id="shell" src="assets/map/cannon/shell.glb"></a-asset-item>
  <a-asset-item id="aotFont" src="assets/fonts/aot_font.ttf"></a-asset-item>
      <audio id="bg-music" src="assets/song.mp3"></audio>
    </a-assets>
  <a-entity id="bgMusic" geometry="primitive: plane" material="color: blue"
          position="0 0 0" sound="src: #bg-music; autoplay: false; loop: true; volume: 1"></a-entity>

    <a-sky id="#sky"></a-sky>
    <a-entity id="vr-menu">
      <a-camera id="menuCam" position="0 2 -1" raycaster="far: 100" camera>
        <a-cursor fuse="true" fuse-timeout="500" color="white"></a-cursor>
      </a-camera>
  <a-image src="#banner" position="0 1.6 -3" width="4" height="1.5" visible="true"></a-image>
    <a-entity troika-text="value: move cursor/look around to start by holding left click; font: #aotFont; fontSize: 0.18; color: #fff; anchor: center" position="0 3 -2.89"> </a-entity>
      <a-entity troika-text="value: subway surfer-inspired game > use wasd to change across 3 lanes; font: #aotFont; fontSize: 0.15; color: #fff; anchor: center" position="0 2.8 -2.89"> </a-entity>

      <a-box position="0 2.9 -2.99" depth="0.1" height="0.6" width="3"></a-box>   
    <a-box id="startBtn" position="0 2.2 -2.99" depth="0.1" height="0.3" width="1"></a-box>
  <a-entity id="startLabel" troika-text="value: start; font: #aotFont; fontSize: 0.1; color: #fff; anchor: center" position="0 2.2 -2.89"></a-entity>
</a-entity>

  <a-entity id="game-entities" visible="false" ground-loop="count:3; speed:15; segmentLength:30">
  <a-entity id="wallEntity" gltf-model="#wall" position="0 0 -100" scale="1 1 1"></a-entity>
    <a-entity id="groundEntity" gltf-model="#ground" position="5 0 -20" scale="3 3 3"></a-entity>
  <a-entity id="horseManager" horse-manager="startZ: -120; poolSize: 5; planCount: 16; maxActive: 5; zJitter: 15; minGapZ: 35"></a-entity>

  <a-entity id="player" lane-controller player-collision gltf-model="#titan_run" animation-mixer scale="0.5 0.5 0.5">
        <a-camera id="playerCam" position="0 4.5 1.5" wasd-controls-enabled="false" look-controls-enabled="true">
          <a-plane id="horsesLeftBg" position="0 0.80 -1.5" width="0.9" height="0.18" color="#1b263b" opacity="0.95"></a-plane>
          <a-entity id="horsesLeftLabel" troika-text="value: 5 to next wave; font: #aotFont; fontSize: 0.12; color: #fff; anchor: center" position="0 0.78 -1.49"></a-entity>
          <a-plane id="waveBg" position="0 0.96 -1.5" width="0.9" height="0.2" color="#c1121f" opacity="0.9"></a-plane>
          <a-entity id="waveLabel" troika-text="value: Wave 1; font: #aotFont; fontSize: 0.14; color: #fff; anchor: center" position="0 0.94 -1.49"></a-entity>
        </a-camera>
      </a-entity>

      <a-entity id="introCam" position="0 0 -100"></a-entity>
      
  <a-entity id="introDirector" intro-director></a-entity>
  <a-entity id="finaleManager" finale-director></a-entity>

      <a-light type="ambient" color="#FFFFFF" intensity="0.3"></a-light>
      <a-light type="directional" color="#FFFFFF" intensity="2" position="0 10 -5" decay="2" distance="50"></a-light>

      <a-entity position="0 0 10">
        <a-light type="point" color="#FFFFFF" intensity="3" distance="50"></a-light>
      </a-entity>
    </a-entity>
  </a-scene>
  <script>

    (function(){
      function fixHUD() {
        try {
          const ids = ['horsesLeftBg','waveBg','horsesLeftLabel','waveLabel'];
          ids.forEach(id => {
            const el = document.querySelector('#' + id);
            if (!el) return;

            const meshes = [];
            const mesh = el.getObject3D && el.getObject3D('mesh');
            if (mesh) meshes.push(mesh);

            if (el.object3D && el.object3D.children && el.object3D.children.length) {
              el.object3D.traverse((c) => { if (c.isMesh) meshes.push(c); });
            }
            meshes.forEach(m => {
              try { m.renderOrder = 9999; if (m.material) { m.material.depthTest = false; m.material.depthWrite = false; m.material.transparent = true; } } catch(_){}
            });
          });
        } catch (_) {}
      }
      if (document.readyState === 'complete') setTimeout(fixHUD, 50); else window.addEventListener('load', function(){ setTimeout(fixHUD, 50); });
    })();
  </script>
  <script>
    window.addEventListener('load', () => {
      try {
        const skyImg = document.getElementById('sky');
        const aSky = document.querySelector('a-sky');
        const scene = document.querySelector('a-scene');
        if (aSky) {
          aSky.setAttribute('src', '#sky');
          aSky.setAttribute('visible', 'true');
          aSky.addEventListener('materialtextureloaded', () => {
            console.log('[diagnostic] a-sky materialtextureloaded');
            try {
              const mesh = aSky.getObject3D && aSky.getObject3D('mesh');
              if (mesh && mesh.material) {
                console.log('[diagnostic] before: material.fog=', mesh.material.fog, 'opacity=', mesh.material.opacity);
                mesh.material.fog = false;
                mesh.material.needsUpdate = true;
                console.log('[diagnostic] after: material.fog=', mesh.material.fog);
              }
            } catch (e) { console.warn('[diagnostic] could not modify sky material', e); }
          });
        }
      } catch (e) {
        console.warn('[diagnostic] error in window load event:', e);
      }
    });
  </script>
  <script>
    // Start background audio on first user gesture so browsers won't block playback.
    (function() {
      function startMusic() {
        const bgEntity = document.getElementById('bgMusic');
        const audioEl = document.getElementById('bg-music');
        // Try A-Frame sound component first
        try {
          if (bgEntity && bgEntity.components && bgEntity.components.sound) {
            bgEntity.components.sound.playSound();
          }
        } catch (e) { /* ignore */ }
        // Fallback to HTMLAudioElement
        try {
          if (audioEl) audioEl.play().catch(()=>{});
        } catch(_){}
        window.removeEventListener('click', startMusic);
        window.removeEventListener('touchstart', startMusic);
      }
      window.addEventListener('click', startMusic, { once: true });
      window.addEventListener('touchstart', startMusic, { once: true });
    })();
  </script>
</body>
</html>
